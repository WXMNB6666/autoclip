name: Sealos image build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: wxmnb6666
  IMAGE_NAME: autoclip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: |
          for attempt in 1 2 3 4 5; do
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}
          cache-from: type=gha,scope=autoclip
          cache-to: type=gha,mode=max,scope=autoclip
